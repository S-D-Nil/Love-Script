<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="party-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1026"/>
      <stop offset="50%" stop-color="#31103f"/>
      <stop offset="100%" stop-color="#4a154b"/>
    </linearGradient>
    <filter id="cake-glow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#party-bg)"/>

  <!-- Confetti and sparkles -->
  <g fill="#f59e0b" opacity="0.8">
    <polygon points="120,60 126,72 138,78 126,84 120,96 114,84 102,78 114,72"/>
    <polygon points="680,80 686,92 698,98 686,104 680,116 674,104 662,98 674,92"/>
    <circle cx="200" cy="120" r="4" fill="#ec4899"/>
    <circle cx="600" cy="140" r="5" fill="#38bdf8"/>
    <circle cx="260" cy="80" r="3" fill="#fbbf24"/>
    <circle cx="530" cy="70" r="4" fill="#f43f5e"/>
  </g>

  <!-- Countdown Timer Pill at the top -->
  <g transform="translate(230, 40)">
    <rect width="340" height="56" rx="28" fill="#ffffff" opacity="0.1" stroke="#f472b6" stroke-width="1.5"/>
    <text x="170" y="36" font-family="monospace" font-weight="900" font-size="26" fill="#fbcfe8" text-anchor="middle" letter-spacing="4">00 : 00 : 00</text>
  </g>

  <!-- 2-Tier Romantic Cake -->
  <g transform="translate(400, 290)" filter="url(#cake-glow)">
    <!-- Plate -->
    <ellipse cx="0" cy="110" rx="190" ry="24" fill="#ffffff" opacity="0.25"/>

    <!-- Bottom Tier -->
    <rect x="-130" y="20" width="260" height="85" rx="14" fill="#f43f5e"/>
    <!-- Frosting drip -->
    <path d="M -130 20 Q -110 45 -90 20 Q -70 50 -50 20 Q -30 45 -10 20 Q 10 50 30 20 Q 50 45 70 20 Q 90 50 110 20 Q 120 40 130 20" fill="#fce7f3"/>

    <!-- Top Tier -->
    <rect x="-90" y="-45" width="180" height="70" rx="12" fill="#fb7185"/>
    <path d="M -90 -45 Q -75 -25 -60 -45 Q -45 -20 -30 -45 Q -15 -25 0 -45 Q 15 -20 30 -45 Q 45 -25 60 -45 Q 75 -20 90 -45" fill="#ffffff"/>

    <!-- Candle 1 -->
    <rect x="-35" y="-85" width="10" height="42" rx="4" fill="#fef08a"/>
    <ellipse cx="-30" cy="-94" rx="6" ry="10" fill="#f59e0b"/>
    <ellipse cx="-30" cy="-92" rx="3" ry="6" fill="#ffffff"/>

    <!-- Candle 2 (Center) -->
    <rect x="-5" y="-95" width="10" height="52" rx="4" fill="#ffffff"/>
    <ellipse cx="0" cy="-104" rx="7" ry="12" fill="#f59e0b"/>
    <ellipse cx="0" cy="-102" rx="3.5" ry="7" fill="#ffffff"/>

    <!-- Candle 3 -->
    <rect x="25" y="-85" width="10" height="42" rx="4" fill="#fef08a"/>
    <ellipse cx="30" cy="-94" rx="6" ry="10" fill="#f59e0b"/>
    <ellipse cx="30" cy="-92" rx="3" ry="6" fill="#ffffff"/>
  </g>

  <!-- Interactive Action Pill Bottom -->
  <g transform="translate(250, 420)">
    <rect width="300" height="50" rx="25" fill="#f43f5e"/>
    <text x="150" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">🎂 Click To Blow Candles &amp; Cut Cake</text>
  </g>
</svg>
