<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rose-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="rose-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#be185d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#rose-bg)"/>

  <!-- Botanical Vine Accents -->
  <path d="M 0 450 Q 150 380 220 500" fill="none" stroke="#84cc16" stroke-width="3" opacity="0.3"/>
  <path d="M 800 450 Q 650 380 580 500" fill="none" stroke="#84cc16" stroke-width="3" opacity="0.3"/>

  <!-- Central Blooming Rose -->
  <g transform="translate(400, 200)" filter="url(#rose-shadow)">
    <!-- Outer Petals -->
    <path d="M -80 0 C -120 -60, -40 -120, 0 -80 C 40 -120, 120 -60, 80 0 C 120 60, 40 120, 0 80 C -40 120, -120 60, -80 0 Z" fill="#fda4af" opacity="0.85"/>
    <path d="M -60 0 C -90 -45, -30 -90, 0 -60 C 30 -90, 90 -45, 60 0 C 90 45, 30 90, 0 60 C -30 90, -90 45, -60 0 Z" fill="#fb7185"/>
    <!-- Core spiral -->
    <path d="M -35 0 C -50 -25, -15 -50, 0 -35 C 15 -50, 50 -25, 35 0 C 50 25, 15 50, 0 35 C -15 50, -50 25, -35 0 Z" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="18" fill="#e11d48"/>
    <!-- Sparkling dewdrops -->
    <circle cx="15" cy="-25" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="-25" cy="18" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Interactive Petals message pills -->
  <g transform="translate(120, 140)">
    <rect width="180" height="44" rx="22" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" filter="url(#rose-shadow)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#be185d" text-anchor="middle">🌸 Petal 1: Your Smile</text>
  </g>
  <g transform="translate(500, 120)">
    <rect width="190" height="44" rx="22" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" filter="url(#rose-shadow)"/>
    <text x="95" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#be185d" text-anchor="middle">🌹 Petal 2: Your Kindness</text>
  </g>
  <g transform="translate(100, 310)">
    <rect width="210" height="44" rx="22" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" filter="url(#rose-shadow)"/>
    <text x="105" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#be185d" text-anchor="middle">✨ Petal 3: Forever With You</text>
  </g>
  <g transform="translate(490, 320)">
    <rect width="210" height="44" rx="22" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" filter="url(#rose-shadow)"/>
    <text x="105" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#be185d" text-anchor="middle">💖 Click Petals To Unfold</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0f172a" text-anchor="middle">Secret Valentine Blooming Garden</text>
  <text x="400" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Interactive Petal Confessions &amp; Custom Romantic Compliments</text>
</svg>
