<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="prop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="60%" stop-color="#ffe3e8"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="heart-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#prop-bg)"/>
  <circle cx="400" cy="220" r="280" fill="url(#heart-glow)"/>

  <!-- Romantic Proposal UI Card Mockup -->
  <g transform="translate(180, 50)" filter="url(#card-shadow)">
    <rect width="440" height="400" rx="32" fill="#ffffff" stroke="#ffe4e6" stroke-width="2"/>

    <!-- Cute Kitten/Bunny holding heart -->
    <g transform="translate(160, 40)">
      <circle cx="60" cy="55" r="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
      <!-- Ears -->
      <polygon points="25,25 35,5 45,25" fill="#fda4af"/>
      <polygon points="75,25 85,5 95,25" fill="#fda4af"/>
      <!-- Eyes -->
      <circle cx="45" cy="48" r="5" fill="#1e293b"/>
      <circle cx="75" cy="48" r="5" fill="#1e293b"/>
      <circle cx="47" cy="46" r="1.5" fill="#fff"/>
      <circle cx="77" cy="46" r="1.5" fill="#fff"/>
      <!-- Cheeks -->
      <ellipse cx="36" cy="58" rx="6" ry="4" fill="#fecdd3"/>
      <ellipse cx="84" cy="58" rx="6" ry="4" fill="#fecdd3"/>
      <!-- Nose & Mouth -->
      <polygon points="60,54 57,51 63,51" fill="#f43f5e"/>
      <path d="M 57 56 Q 60 60 63 56" fill="none" stroke="#64748b" stroke-width="2"/>

      <!-- Big Sparkling Heart in Paws -->
      <g transform="translate(30, 65)">
        <path d="M 30 20 C 30 5, 10 -5, -5 18 C -20 -5, -40 5, -40 20 C -40 55, -5 75, -5 90 C -5 75, 30 55, 30 20 Z" fill="#f43f5e"/>
        <path d="M -5 10 Q 5 2 15 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Proposal Headline -->
    <text x="220" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#0f172a" text-anchor="middle">Do You Love Me?</text>
    <text x="220" y="255" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="15" fill="#64748b" text-anchor="middle">Click YES to make my world shine!</text>

    <!-- Buttons -->
    <!-- YES Button -->
    <g transform="translate(70, 290)">
      <rect width="130" height="54" rx="27" fill="#f43f5e"/>
      <text x="65" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle">YES! ❤️</text>
    </g>

    <!-- NO Button (Runaway playful element) -->
    <g transform="translate(240, 290)">
      <rect width="130" height="54" rx="27" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="65" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle">No 😢</text>
      <!-- Cursor chasing hint -->
      <path d="M 125 45 L 140 60 L 132 63 L 142 80 L 135 84 L 125 67 L 118 73 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Note under buttons -->
    <text x="220" y="375" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#f43f5e" text-anchor="middle">✨ Warning: The "No" button will run away forever!</text>
  </g>
</svg>
