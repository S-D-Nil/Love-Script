<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="night-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16"/>
      <stop offset="50%" stop-color="#181335"/>
      <stop offset="100%" stop-color="#2d1238"/>
    </linearGradient>
    <radialGradient id="nebula-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#night-sky)"/>
  <rect width="800" height="500" fill="url(#nebula-glow)"/>

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="150" cy="140" r="2" opacity="0.9"/>
    <circle cx="210" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="340" cy="90" r="2.5" opacity="1" filter="url(#glow)"/>
    <circle cx="480" cy="60" r="2" opacity="0.8"/>
    <circle cx="620" cy="110" r="1.5" opacity="0.9"/>
    <circle cx="730" cy="70" r="2.5" opacity="1" filter="url(#glow)"/>
    <circle cx="680" cy="200" r="1.8" opacity="0.8"/>
    <circle cx="120" cy="320" r="1.5" opacity="0.7"/>
  </g>

  <!-- Constellation in Heart Shape -->
  <g stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <polyline points="320,160 360,110 400,140 440,110 480,160 400,240 320,160"/>
    <circle cx="320" cy="160" r="4" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="360" cy="110" r="4" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="400" cy="140" r="4" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="440" cy="110" r="4" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="480" cy="160" r="4" fill="#fb7185" filter="url(#glow)"/>
    <circle cx="400" cy="240" r="5" fill="#f43f5e" filter="url(#glow)"/>
  </g>

  <!-- Glowing Parchment Letter at the bottom -->
  <g transform="translate(200, 240)">
    <rect width="400" height="220" rx="16" fill="#1e1b2e" stroke="#f472b6" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="20" y="20" width="360" height="180" rx="8" fill="#13111c"/>

    <!-- Audio Player Bar -->
    <g transform="translate(40, 40)">
      <circle cx="16" cy="16" r="16" fill="#f43f5e"/>
      <polygon points="12,9 24,16 12,23" fill="#ffffff"/>
      <rect x="45" y="12" width="230" height="8" rx="4" fill="#334155"/>
      <rect x="45" y="12" width="120" height="8" rx="4" fill="#f43f5e"/>
      <circle cx="165" cy="16" r="6" fill="#ffffff"/>
      <text x="285" y="19" font-family="monospace" font-size="12" fill="#cbd5e1">01:42</text>
    </g>

    <!-- Handwritten Love Note Typewriter preview -->
    <text x="40" y="105" font-family="'Caveat', cursive, sans-serif" font-size="24" fill="#fce7f3">"In every universe, my stars point to you..."</text>
    <text x="40" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Interactive Constellation &amp; Typewriter Audio Experience</text>

    <!-- Wax seal -->
    <g transform="translate(320, 140)">
      <circle cx="20" cy="20" r="22" fill="#be123c" stroke="#9f1239" stroke-width="2"/>
      <text x="20" y="26" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">LS</text>
    </g>
  </g>
</svg>
